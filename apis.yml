name: Double Robotics
description: >-
  Double Robotics builds telepresence robots for hybrid work and education,
  best known for the self-driving Double 3 videoconferencing robot and the
  earlier iPad-based Double 2. Its developer program spans three surfaces: the
  Double 3 SDK (a local command-and-event API exposed over a Unix domain socket
  on the robot, covering base movement, navigation, PTZ cameras, depth sensors,
  WebRTC calling, and standby/sidebar apps), iOS SDKs for the Double 2 (Basic
  Control and Camera Kit), and a Fleet REST API for programmatic access to
  fleet-management data such as robots, users, call logs, and visitor passes.
  Added to the API Evangelist network from VC-portfolio discovery and enriched
  against the company's public developer surface.
