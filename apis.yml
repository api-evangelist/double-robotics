apis:
- name: Double 3 SDK
  description: >-
    Local developer API for the Double 3 telepresence robot. Commands and events
    are exchanged as JSON packets over a standard Unix domain socket with the
    core D3 system service (Ubuntu 18.04, aarch64). API v1.3.1 groups
    functionality into ~25 categories including base, navigate, ptz, camera,
    depth, webrtc, network, system, and events (subscribe-based). A web Monitor
    at http://YOUR_D3_IP:8080 lets developers test commands before coding.
  humanURL: https://github.com/doublerobotics/d3-sdk
  properties:
  - type: Documentation
    url: https://github.com/doublerobotics/d3-sdk/blob/master/docs/API.md
  - type: SourceCode
    url: https://github.com/doublerobotics/d3-sdk
- name: Fleet REST API
  description: >-
    REST API for Double fleet management data — robots, users, call logs, and
    visitor passes. API keys and reference documentation are issued through the
    Fleet Management account portal.
  humanURL: https://www.doublerobotics.com/developer.html
